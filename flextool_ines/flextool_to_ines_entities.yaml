# Reverse of ines_to_flextool_entities.yaml (FlexTool source -> INES target)
# source_entity_class:
#   target_entity_class OR
#   list of target_entity_classes:
#     optional [list of dimension positions] OR
#     optional [list of dimension positions, {source_feature: source_method} or source_feature]
node: node
connection: link
unit: unit
constraint: constraint
group: set
solve: solve_pattern
timeline: system
group__unit:
  - set__unit: [[1], [2]]
group__node:
  - set__node: [[1], [2]]
group__connection:
  - set__link: [[1], [2]]
unit__outputNode:
  - unit__to_node: [[1], [2]]
unit__inputNode:
  - node__to_unit: [[2], [1]]
connection__node__node:
  - node__link__node: [[2], [1], [3]]
# group__unit__node -> set__unit_flow is handled manually in process_flow_groups
# because the INES unit_flow member entity must be created before the set__unit_flow
# relationship can be added.
